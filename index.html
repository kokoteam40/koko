<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F1E8">
  <meta name="description" content="Thomas Kosciolek — KoKo* — Créateur de l'énergie collective.">
  <meta property="og:title" content="Thomas Kosciolek — KoKo*">
  <meta property="og:description" content="Créateur de l'énergie collective. Faire grandir les idées. Rassembler les énergies. Créer du mouvement.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kokoteam40.github.io/koko/">
  <meta property="og:image" content="https://kokoteam40.github.io/koko/thomas.jpg">
  <title>Thomas Kosciolek — KoKo*</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --pin:#4F765B;
      --soleil:#F4C430;
      --ocean:#1657C8;
      --sable:#F5F1E8;
      --ink:#243229;
      --white:#fffdf8;
    }
    *{box-sizing:border-box}
    html,body{margin:0;max-width:100%;overflow-x:hidden}
    body{
      min-height:100vh;
      background:var(--sable);
      color:var(--ink);
      font-family:"Montserrat",Arial,sans-serif;
    }
    .page{
      width:min(100%,560px);
      margin:0 auto;
      min-height:100vh;
      background:var(--sable);
      overflow:hidden;
      position:relative;
    }
    .hero{
      padding:28px 22px 12px;
      text-align:center;
    }
    .brand{
      font-family:"DM Serif Display",serif;
      font-size:42px;
      line-height:1;
      color:var(--pin);
      margin-bottom:18px;
    }
    .portrait-wrap{
      width:150px;height:150px;
      margin:0 auto 17px;
      padding:5px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--soleil),var(--ocean));
    }
    .portrait{
      display:block;width:100%;height:100%;
      object-fit:cover;border-radius:50%;
      border:4px solid var(--sable);
    }
    h1{
      font-family:"DM Serif Display",serif;
      font-size:32px;line-height:1.05;
      margin:0 0 5px;color:var(--pin);
    }
    .role{
      margin:0 auto 13px;
      font-weight:700;font-size:15px;
      color:var(--ocean);
    }
    .intro{
      margin:0 auto;
      max-width:430px;
      font-size:14px;line-height:1.55;
    }
    .actions{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:9px;
      padding:17px 18px 9px;
    }
    .action,.contact{
      text-decoration:none;
      border-radius:15px;
      font-weight:700;
      transition:transform .15s ease;
    }
    .action:active,.contact:active{transform:scale(.98)}
    .action{
      min-height:60px;
      display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      gap:4px;
      background:var(--white);
      color:var(--pin);
      border:1px solid rgba(79,118,91,.18);
      box-shadow:0 5px 16px rgba(36,50,41,.07);
      font-size:12px;
    }
    .action .icon{font-size:20px;line-height:1}
    .contact{
      display:flex;align-items:center;justify-content:center;
      margin:5px 18px 17px;
      min-height:53px;
      background:var(--pin);
      color:white;
      box-shadow:0 7px 18px rgba(79,118,91,.20);
      font-size:14px;
    }
    .signature-box{
      margin:0 18px 15px;
      padding:17px 12px;
      border-radius:18px;
      background:rgba(255,253,248,.72);
      text-align:center;
      border:1px solid rgba(79,118,91,.12);
    }
    .signature{
      font-family:"DM Serif Display",serif;
      color:var(--pin);
      font-size:clamp(15px,4.15vw,21px);
      line-height:1.15;
      white-space:nowrap;
      letter-spacing:-.15px;
    }
    .location{
      margin-top:8px;
      font-size:10px;
      letter-spacing:1.1px;
      text-transform:uppercase;
      font-weight:600;
      color:#647269;
    }

    /* Paysage entièrement contenu dans la largeur mobile */
    .landscape{
      width:100%;
      height:128px;
      position:relative;
      overflow:hidden;
      margin-top:2px;
    }
    .sun{
      position:absolute;
      width:58px;height:58px;border-radius:50%;
      background:var(--soleil);
      right:12%;top:8px;
    }
    .hill-back,.hill-front{
      position:absolute;
      left:-5%;width:110%;
      border-radius:50% 50% 0 0 / 100% 100% 0 0;
    }
    .hill-back{
      height:80px;bottom:-27px;
      background:#86a58c;
      transform:rotate(-2deg);
    }
    .hill-front{
      height:72px;bottom:-39px;
      background:var(--pin);
      transform:rotate(3deg);
    }
    .ocean{
      position:absolute;left:0;right:0;bottom:0;height:28px;
      background:var(--ocean);
    }
    .wave{
      position:absolute;
      width:120%;height:16px;left:-10%;bottom:20px;
      border-top:4px solid rgba(255,255,255,.85);
      border-radius:50%;
      transform:rotate(-1deg);
    }
    footer{
      background:var(--ocean);
      color:white;
      text-align:center;
      padding:8px 12px calc(13px + env(safe-area-inset-bottom));
      font-size:10px;
      letter-spacing:1.25px;
      text-transform:uppercase;
      font-weight:600;
    }
    @media(max-width:350px){
      .hero{padding-left:15px;padding-right:15px}
      .brand{font-size:38px}
      h1{font-size:29px}
      .actions{padding-left:12px;padding-right:12px}
      .contact,.signature-box{margin-left:12px;margin-right:12px}
      .signature{font-size:14px}
    }
  </style>
</head>
<body>
<main class="page">
  <section class="hero">
    <div class="brand">KoKo*</div>
    <div class="portrait-wrap">
      <img class="portrait" src="thomas.jpg" alt="Thomas Kosciolek">
    </div>
    <h1>Thomas Kosciolek</h1>
    <p class="role">Créateur de l’énergie collective</p>
    <p class="intro">Faire grandir les idées. Rassembler les énergies. Créer du mouvement.</p>
  </section>

  <section class="actions" aria-label="Me contacter">
    <a class="action" href="tel:+33635176820"><span class="icon">☎</span><span>Appeler</span></a>
    <a class="action" href="mailto:kosciolek.thomas@gmail.com"><span class="icon">✉</span><span>Écrire</span></a>
    <a class="action" href="https://www.linkedin.com/in/%F0%9F%97%9D%EF%B8%8F-thomas-kosciolek-%F0%9F%8C%B6%EF%B8%8F-a014b7a/" target="_blank" rel="noopener"><span class="icon">in</span><span>LinkedIn</span></a>
  </section>

  <a class="contact" href="thomas-kosciolek.vcf" download>+ Ajouter à mes contacts</a>

  <section class="signature-box">
    <div class="signature">Des racines. De l’énergie. De la liberté.</div>
    <div class="location">Landes · Océan · Humain · Possibles</div>
  </section>

  <div class="landscape" aria-hidden="true">
    <div class="sun"></div>
    <div class="hill-back"></div>
    <div class="hill-front"></div>
    <div class="wave"></div>
    <div class="ocean"></div>
  </div>
  <footer>KoKo* · Thomas Kosciolek</footer>
</main>
</body>
</html>
