<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F1E8">
<meta name="description" content="Thomas Kosciolek — KoKo* — Créateur de l'énergie collective.">
<meta property="og:title" content="Thomas Kosciolek — KoKo*">
<meta property="og:description" content="Créateur de l'énergie collective. Faire grandir les idées. Rassembler les énergies. Créer du mouvement.">
<meta property="og:type" content="website">

<title>Thomas Kosciolek — KoKo*</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pin:#4F765B;--sun:#F4C430;--ocean:#1657C8;--sand:#F5F1E8;--ink:#243229;--white:#fffdf8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden}
body{background:var(--sand);color:var(--ink);font-family:Montserrat,Arial,sans-serif}
.card{width:min(100%,560px);min-height:100vh;margin:auto;overflow:hidden;background:var(--sand)}
.hero{text-align:center;padding:24px 20px 10px}
.logo{font-family:"DM Serif Display",serif;font-size:44px;line-height:1;color:var(--pin);margin-bottom:14px}
.logo .star{color:var(--sun)}
.photo-ring{width:160px;height:160px;margin:0 auto 14px;padding:5px;border-radius:50%;background:linear-gradient(135deg,var(--sun),var(--ocean))}
.photo-window{width:100%;height:100%;border-radius:50%;overflow:hidden;border:4px solid var(--sand);background:#eee}
.photo-window img{display:block;width:100%;height:100%;object-fit:cover;object-position:center 22%;transform:scale(.88)}
h1{font-family:"DM Serif Display",serif;color:var(--pin);font-size:32px;line-height:1.05;margin:0 0 4px}
.role{color:var(--ocean);font-weight:700;font-size:14px;margin:0 0 12px}
.intro{font-size:14px;line-height:1.55;margin:0 auto;max-width:470px}
.intro .line2{display:block}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:17px 18px 10px}
.action{min-height:76px;border-radius:17px;background:var(--white);border:1px solid rgba(79,118,91,.12);box-shadow:0 6px 18px rgba(36,50,41,.07);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-decoration:none;font-size:12px;font-weight:700}
.icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700}
.call{color:var(--pin)} .mail{color:var(--ink)} .linkedin{color:var(--ocean)}
.mail .icon{color:var(--sun);font-size:29px}.linkedin .icon{font-size:27px}
.save{margin:4px 18px 18px;min-height:54px;border-radius:17px;background:var(--pin);color:white;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;box-shadow:0 7px 18px rgba(79,118,91,.2)}
.signature{text-align:center;padding:2px 10px 7px;font-family:"DM Serif Display",serif;color:var(--pin);font-size:clamp(15px,4.2vw,22px);white-space:nowrap}
.landscape{position:relative;width:100%;height:180px;overflow:hidden}
.sunset{position:absolute;width:62px;height:62px;border-radius:50%;background:var(--sun);left:63%;top:52px}
.sea{position:absolute;left:0;right:0;bottom:0;height:70px;background:var(--ocean)}
.dune{position:absolute;right:-4%;bottom:48px;width:58%;height:52px;background:#e8d39d;border-radius:70% 20% 0 0;transform:rotate(2deg)}
.dune2{position:absolute;right:-3%;bottom:55px;width:42%;height:39px;background:var(--pin);border-radius:70% 30% 0 0;opacity:.92}
.pines{position:absolute;left:0;bottom:55px;width:43%;height:105px}
.trunk{position:absolute;bottom:0;width:4px;background:#315642;border-radius:4px}
.crown{position:absolute;background:var(--pin);border-radius:55% 45% 55% 45%}
.t1{left:18%;height:75px}.t2{left:38%;height:91px}.t3{left:59%;height:68px}.t4{left:78%;height:84px}
.c1{width:58px;height:34px;left:5%;top:23px}.c2{width:72px;height:38px;left:22%;top:6px}.c3{width:64px;height:34px;left:48%;top:29px}.c4{width:72px;height:37px;left:66%;top:14px}
.wave{position:absolute;left:-5%;bottom:51px;width:110%;height:22px;border-top:4px solid rgba(255,255,255,.9);border-radius:50%}
.location{text-align:center;background:var(--ocean);color:white;padding:8px 10px calc(13px + env(safe-area-inset-bottom));font-size:10px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase}
@media(max-width:370px){.hero{padding-left:14px;padding-right:14px}.logo{font-size:40px}.photo-ring{width:145px;height:145px}h1{font-size:29px}.intro{font-size:13px}.actions{padding-left:12px;padding-right:12px;gap:7px}.save{margin-left:12px;margin-right:12px}.signature{font-size:14px}}
</style>
</head>
<body>
<main class="card">
<section class="hero">
  <div class="logo">KoKo<span class="star">*</span></div>
  <div class="photo-ring"><div class="photo-window"><img src="thomas.jpg" alt="Thomas Kosciolek"></div></div>
  <h1>Thomas Kosciolek</h1>
  <p class="role">Créateur de l’énergie collective</p>
  <p class="intro">Faire grandir les idées. Rassembler les énergies.<span class="line2">Créer du mouvement.</span></p>
</section>
<section class="actions">
  <a class="action call" href="tel:+33635176820"><span class="icon">☎</span><span>Appeler</span></a>
  <a class="action mail" href="mailto:kosciolek.thomas@gmail.com"><span class="icon">✉</span><span>Écrire</span></a>
  <a class="action linkedin" href="https://www.linkedin.com/in/%F0%9F%97%9D%EF%B8%8F-thomas-kosciolek-%F0%9F%8C%B6%EF%B8%8F-a014b7a/" target="_blank" rel="noopener"><span class="icon">in</span><span>LinkedIn</span></a>
</section>
<a class="save" href="thomas-kosciolek.vcf" download>＋ Ajouter à mes contacts</a>
<div class="signature">Des racines. De l’énergie. De la liberté.</div>
<div class="landscape" aria-hidden="true">
  <div class="sunset"></div><div class="dune"></div><div class="dune2"></div>
  <div class="pines">
    <div class="trunk t1"></div><div class="trunk t2"></div><div class="trunk t3"></div><div class="trunk t4"></div>
    <div class="crown c1"></div><div class="crown c2"></div><div class="crown c3"></div><div class="crown c4"></div>
  </div>
  <div class="sea"></div><div class="wave"></div>
</div>
<div class="location">NATURE * OCEAN * HUMAIN * SIMPLICITE</div></main>
</body>
</html>
